name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        # El test de paridad entre los cargadores Python y JavaScript necesita
        # node. Se instala explícitamente para que la guarda no pueda
        # desaparecer en silencio si cambia la imagen del runner.
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Compile check
        run: python -m py_compile premium_bot.py

      - name: Tests (pytest)
        run: python -m pytest -q
